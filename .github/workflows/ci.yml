name: CI - TourGuide

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore TourGuide.sln

      - name: Build
        run: dotnet build TourGuide.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TourGuideTest/TourGuideTest.csproj --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Publish
        run: dotnet publish Api/TourGuide.csproj -c Release -o publish/TourGuide --no-build

      - name: Zip artefact
        run: zip -r TourGuide.zip publish

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: TourGuide
          path: TourGuide.zip